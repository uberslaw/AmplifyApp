<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050510" />
    <title>Mushroom Blaze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Mushroom Blaze game"></canvas>
      <div id="ui" class="ui">
        <div id="title-screen" class="screen">
          <h1 class="brand">Mushroom Blaze</h1>
          <p class="tagline">
            Chase Nyan Cat across space. Collect every rainbow colour through the gates to speed up
            and catch them.
          </p>
          <button id="play-btn" class="cta" type="button">Play</button>
          <p class="hint">↑↓ steer · Space boost · fill the spectrum · dodge meteors</p>
        </div>
        <div id="hud" class="hud hidden">
          <div class="hud-top">
            <span>Score <strong id="score">0</strong></span>
            <span>Spectra <strong id="spectra">0/3</strong></span>
            <span>Miss <strong id="misses">0/3</strong></span>
            <span>Nyan <strong id="nyan-gap">0</strong></span>
            <span>Best <strong id="best">0</strong></span>
          </div>
          <div id="spectrum-row" class="spectrum-row" aria-label="Spectrum collected"></div>
          <span class="hud-dist">Dist <strong id="distance">0</strong>m</span>
        </div>
        <div id="pause-banner" class="banner hidden">Paused</div>
        <div id="nyan-banner" class="banner nyan-banner hidden"></div>
        <div id="game-over" class="screen hidden">
          <h2 id="over-title" class="over-title">Crashed!</h2>
          <p class="over-score">Score <strong id="final-score">0</strong></p>
          <p class="over-best">Best <strong id="final-best">0</strong></p>
          <button id="restart-btn" class="cta" type="button">Ride Again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
